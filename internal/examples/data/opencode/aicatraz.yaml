# opencode in a jail, with git push through you.
#
# Start it with `aicatraz opencode`. The first run installs opencode, builds
# the image from Dockerfile.az (you are asked to approve it, answer p to
# remember), and copies your opencode settings in.
volumes:
  - .:rw
  - ./.az/aicatraz.yaml:hi   # this config: the agent can't read or change its own rules

# The jail has no network unless you say so, and opencode needs the service of
# your model provider. This asks about each host the first time (answer p to
# remember it, e to change the ports). `network: open` would allow everything;
# rules like {to: api.openai.com, ports: 443, decision: allow} fix the hosts.
network:
  default: ask

agent:
  tool: opencode
  skip_permissions: true   # the jail is the boundary, so opencode's own prompts are redundant

rules:
  # Pushing needs your keys, which live on the host. You are asked each time,
  # and shown the repository's config and hooks if they changed.
  - command: git
    args: [push, "*"]
    decision: ask
    depends_on: auto
    env_pass: [SSH_AUTH_SOCK]

  # Every other git command runs in the jail.
  - command: git
    decision: local
