# ╔════════════════════════════════════════════════════════════════════════╗
# ║  aicatraz.yaml                                                         ║
# ║  Describes the jail for this project. Everything below is optional.    ║
# ╚════════════════════════════════════════════════════════════════════════╝
#
#   aicatraz config check     check this file
#   aicatraz run              start a shell in the jail
#   aicatraz claude           start Claude Code in the jail (also: opencode)
#   aicatraz up               like run, as a session you can detach from (Ctrl-Y)
#
# Lines starting with `# key:` are examples. To switch one on, remove the `# `: the
# hash and the space after it, so that the key starts in the first column.

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  PROJECT AND IMAGE                                                     ║
# ║  Who this project is, and what the jail runs on.                       ║
# ╚════════════════════════════════════════════════════════════════════════╝

# Name of this project's state (pins, sessions, image). By default it is derived from
# the directory name and the config's real path; set it to keep your history when the
# project moves.
# project:
#   id: {{PROJECT}}

# The image the jail runs in. By default: Dockerfile.az next to this file if there is
# one (`aicatraz init dockerfile` writes one), else a plain Debian.
# image: debian:13                 # an image to use as it is
# image:                           # or a build
#   dockerfile: Dockerfile.az
#   context: .

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  VOLUMES                                                               ║
# ║  What the agent can see. Everything else on your machine is invisible. ║
# ╚════════════════════════════════════════════════════════════════════════╝

#   path:rw   read and write
#   path:ro   read only
#   path:hi   hidden: reads as empty (the path must exist, inside an rw/ro volume)
# Paths starting with ./ or ../ are relative to this file, so the config works
# for everyone, wherever they check the project out. `~/x` and absolute paths work too.
volumes:
  - .:rw
  - ./aicatraz.yaml:hi   # this config: the agent can't read or change its own rules
  # - ./.env:hi                  # a secret the agent must not see

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  NETWORK                                                               ║
# ║  What the jail can reach, and what can reach the jail.                 ║
# ╚════════════════════════════════════════════════════════════════════════╝

# The jail's network. With no section, or `network: off`, the jail has no network
# at all. `network: open` lets it connect anywhere. A mapping like the one below
# limits it: every TCP connection is checked against the rules, and one no rule
# covers is asked about (default: ask) or refused (default: deny). UDP and ping are
# rejected unless a rule for an IP address allows them. Rules are checked top to
# bottom, the first match wins. Needs a one-time build of a small helper image
# (network access).
#   to      a host name, *.domain, an IPv4 address, a CIDR range, or *
#   ports   22, 443, 8000-8080 and so on, or * (default: any port)
#   proto   tcp (the default for names), udp, icmp (for addresses only)
network: off

# network:
#   default: ask                  # or deny
#   dns: open                     # or restricted: only names a rule covers resolve
#   resolvers: [1.1.1.1]          # default: this machine's
#   rules:
#     - {to: api.anthropic.com, ports: 443, decision: allow}
#     - {to: "*.github.com", ports: [22, 443], decision: allow}
#     - {to: 10.20.0.0/16, ports: "5432, 5433", decision: allow}
#     - {to: 1.1.1.1, ports: 53, proto: udp, decision: allow}

# Publish ports of the jail on this machine, to reach a server inside it from your
# browser. Needs a network (`open`, or rules). Written as in docker: a port,
# host:container, or address:host:container[/udp]. Without an address the port is on
# 127.0.0.1 only. The server in the jail must listen on 0.0.0.0, not on 127.0.0.1.
# ports:
#   - 3000                       # http://127.0.0.1:3000 -> port 3000 in the jail
#   - "8080:80"

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  HARDWARE                                                              ║
# ║  Arduino, ESP and Pico boards, USB serial adapters.                    ║
# ╚════════════════════════════════════════════════════════════════════════╝

# Hardware to hand to the jail while it is plugged in. The jail gets the device nodes
# of the devices you name, created when they appear and removed when they disappear,
# also after a reset or a re-plug. `aicatraz devices` lists what is plugged in.
# devices:
#   - serial: "usb-Arduino_*"      # a name under /dev/serial/by-id, * allowed
#   - usb: "2e8a:*"                # vendor:product (a Raspberry Pi Pico), * allowed
#   - usb: "1a86:7523"             # a CH340 adapter ...
#     usb_serial: "A5069*"         # ... with this serial number
#   - path: /dev/ttyUSB0           # a fixed device node

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  INSIDE THE JAIL                                                       ║
# ║  Environment, resource limits and sudo.                                ║
# ╚════════════════════════════════════════════════════════════════════════╝

# Environment variables in the jail.
# env:
#   static: {EDITOR: vim}          # fixed values
#   from_host: [AWS_PROFILE]       # copied from your shell at launch (the agent can read them)

# Resource limits for the jail.
# limits:
#   pids: 1024                     # maximum number of processes
#   memory: 2g                     # no limit if unset

# Passwordless sudo inside the jail. It loosens the jail: root in the container,
# a writable root filesystem and some capabilities. See docs/security.md.
sudo: false

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  THE DOOR TO YOUR MACHINE                                              ║
# ║  Commands the agent may run outside the jail, and how you are asked.   ║
# ╚════════════════════════════════════════════════════════════════════════╝

# Commands the agent may run on YOUR machine, outside the jail. Anything not
# listed here can't run on the host. The first matching rule wins.
#   allow  runs without asking
#   ask    asks you first (an overlay in `aicatraz up`, a popup in tmux, or --approval-tty)
#   local  runs the jail's own copy of the command, inside the jail
#   deny   refuses
# rules:
#   - command: make
#     args: [build, test]
#     decision: local
#   - command: make
#     args: [deploy]
#     decision: ask
#     depends_on: auto           # notice when the Makefile changed since you last approved it
#   - command: git
#     args: [status, diff, log, "*"]
#     deny_flags: [--output, -o]   # a call using one of these doesn't match this rule
#     decision: allow
#     depends_on: auto             # git runs hooks from the workspace: notice when they change
#     confine_paths: true          # refuse arguments that point outside the mounted volumes
#   - command: terraform
#     args: [plan]
#     decision: ask
#     env_pass: [AWS_REGION]       # variables passed on from the jail

# How long an `ask` prompt waits before it counts as a deny (5s to 1h).
# approval:
#   timeout: 2m

# What happens when a hidden path turns out to be visible (say, replaced on the host):
# stop the session (default), warn once, or off.
# canary:
#   action: stop
#   interval: 3s

# Variable names (globs) that are never passed to a host command, on top of the
# built-in set (LD_*, PATH, BASH_ENV, ...).
# global:
#   env_strip: ["AWS_*"]

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  CODING AGENT                                                          ║
# ║  `aicatraz claude` and `aicatraz opencode` need no config.             ║
# ╚════════════════════════════════════════════════════════════════════════╝

# The coding agent for `aicatraz agent`.
# agent:
#   tool: claude                   # or opencode
#   version: latest                # or a pinned version
#   skip_permissions: true         # the jail is the boundary, so the agent's own prompts are redundant

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  LOOK                                                                  ║
# ║  The status bar of `aicatraz up` sessions.                             ║
# ╚════════════════════════════════════════════════════════════════════════╝

# To tell projects apart at a glance (a red bar for the project that deploys).
# `aicatraz bar-colors` shows the themes. A flag overrides this, and this overrides
# your AICATRAZ_BAR_* variables.
# bar:
#   theme: brick                 # a name from `aicatraz bar-colors`, or `random`
#   fg: white                    # text color: a name, 0-255, #rrggbb or default
#   bg: "#102030"                # background; fg and bg override the theme's
