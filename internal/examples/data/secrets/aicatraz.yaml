# A project with secrets the agent must not see, but that a host command may use.
#
# Create .env and .secrets/ before starting: a hidden path has to exist.
# Prefer hiding a directory (.secrets/) over a single file: if an editor saves
# a hidden FILE by renaming a new one over it, the file is no longer hidden
# (aicatraz notices and stops the session, see `canary` below).
volumes:
  - {{PROJECT}}:rw
  - {{PROJECT}}/.env:hi
  - {{PROJECT}}/.secrets:hi

# What happens when a hidden path turns out to be visible: stop (default),
# warn, or off.
canary:
  action: stop

rules:
  # `make deploy` reads .env on the host. The agent can't, but the command it
  # starts can, and you are asked every time.
  - command: make
    args: [deploy]
    decision: ask
    depends_on: auto
