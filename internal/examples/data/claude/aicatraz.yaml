# Claude Code in a jail, with git push through you.
#
# Start it with `aicatraz claude`. The first run installs Claude Code, builds
# the image from Dockerfile.az (you are asked to approve it, answer p to
# remember), and copies your Claude settings in.
volumes:
  - .:rw
  - ./aicatraz.yaml:hi   # this config: the agent can't read or change its own rules

# The jail has no network unless you say so, and Claude needs its service.
# This allows Anthropic's API and asks about everything else (answer p to
# remember a host, e to change the ports). `network: open` would allow all.
network:
  default: ask
  rules:
    - {to: "*.anthropic.com", ports: 443, decision: allow}

agent:
  tool: claude
  skip_permissions: true   # the jail is the boundary, so Claude's own prompts are redundant

rules:
  # Pushing needs your keys, which live on the host. You are asked each time,
  # and shown the repository's config and hooks if they changed.
  - command: git
    args: [push, "*"]
    decision: ask
    depends_on: auto
    env_pass: [SSH_AUTH_SOCK]

  # Every other git command runs in the jail.
  - command: git
    decision: local
